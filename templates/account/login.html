{% extends "base.html" %}
{% load static %}
{% load tailwind_filters %}
{% block nav %}{% endblock nav %}
{% block content %}
    <div class="container h-screen flex flex-col justify-center items-center gap-y-4">
        <h5 class="bg-secondary-50 tracking-tight text-[40px]">The Rosha Forms</h5>
        <form method="post" class="w-1/3">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-lg mt-4 hover:bg-primary-800 transition-all duration-300 ease-linear text-secondary-200 bg-primary-700 font">Submit</button>
            <span>Don't have an account yet? <a href="{% url "account_signup" %}" class="underline ms-0.5">Sign up</a></span>
        </form>
    </div>
{% endblock content %}
