{% extends "base.html" %}
{% load static %}
{% load tailwind_filters %}
{% block nav %}{% endblock nav %}
{% block content %}
    <div class="container h-screen flex flex-col justify-center items-center gap-y-4">
        <form method="post" class="w-1/3">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-lg mt-4 hover:bg-primary-800 transition-all duration-300 ease-linear text-secondary-200 bg-primary-700 font">Sign up</button>
        </form>
    </div>
{% endblock content %}
