{% load tailwind_field %}
{% if field.is_hidden %}
   {{ field }}
{% else %}
   {# Opening Div and Label first #}
   <div class="flex flex-col w-full">
      {% if field.label and form_show_labels %}
         <label for="{{ field.id_for_label }}"
                class="{% if label_class %}{{ label_class }}{% endif %}">
            {{ field.label|safe }}
            {% if field.field.required %}<span class="asteriskField">*</span>{% endif %}
         </label>
      {% endif %}
      <div id="div_{{ field.auto_id }}"
           class="{% if wrapper_class %}{{ wrapper_class }}{% endif %}{% if field_class %}{{ field_class }}{% else %}space-y-2 {% endif %}relative">
         {# otherwise use django rendering with additional classes added #}
         <div class="grid grid-cols-2 gap-x-12">
            <div class="relative flex w-full items-center">
               <input id="id_{{ field.name }}_0"
                      type="text"
                      name="{{ field.name }}_0"
                      autocomplete="off"
                      readonly
                      class="input-primary input-carlendar dateinput rounded-lg leading-normal px-4 py-4 border-gray-300 focus:outline text-gray-700 appearance-none bg-white border focus:outline-none datepicker-input cursor-pointer"
                      datepicker
                      datepicker-title="The Rosha"
                      datepicker-format="d MM yyyy"
                      datepicker-buttons
                      value="{{ field.value|date:"d F Y" }}">
               <div class="absolute end-4 top-1/2 -translate-y-1/2 flex items-center justify-center pointer-events-none">
                  <svg class="size-6 text-primary-700 dark:text-gray-400"
                       aria-hidden="true"
                       xmlns="http://www.w3.org/2000/svg"
                       width="24"
                       height="24"
                       fill="none"
                       viewBox="0 0 24 24">
                     <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z" />
                  </svg>
               </div>
            </div>
            <div class="relative flex w-full items-center">
               <input id="id_{{ field.name }}_1"
                      type="time"
                      value="{{ field.value|date:"H:i" }}"
                      name="{{ field.name }}_1"
                      class="input-primary input-carlendar dateinput rounded-lg px-4 leading-normal py-4 border-gray-300 focus:outline text-gray-700 appearance-none bg-white border focus:outline-none datepicker-input cursor-auto"
                      autocomplete="off">
            </div>
         </div>
         {% include 'tailwind/layout/help_text_and_errors.html' %}
      </div>
   </div>
{% endif %}
