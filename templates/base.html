{% load static %}
<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="stylesheet" href="{% static "css/dist/project.css" %}">
      <title>
         {% block title %}
         {% endblock title %}
      </title>
      {% block headers %}
      {% endblock headers %}
   </head>
   <body>
      <section class="container">
         {% include "components/navbar.html" %}
         {% block content %}
         {% endblock content %}
         {% block modal %}
         {% endblock modal %}
      </section>
      <script src="{% static "js/flowbite.min.js" %}"></script>
      <script src="{% static "js/simple-datatables.js" %}"></script>
      {% block javascript %}
      {% endblock javascript %}
   </body>
</html>
