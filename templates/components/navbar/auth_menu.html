{% if user.is_authenticated %}
   <div class="flex gap-x-4 hover:bg-secondary-200 transition-all duration-200 ease-linear">
      <button id="user-menu-button"
              type="button"
              class="flex items-center text-sm rounded md:me-0 text-primary-700 focus:ring-primary-500 dark:focus:ring-gray-600 cursor-pointer border-2 border-primary-700 ps-1 pe-2.5 py-0.5"
              aria-expanded="false"
              data-dropdown-toggle="user-dropdown"
              data-dropdown-placement="bottom">
         <svg class="size-7 dark:text-white me-2"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              fill="currentColor"
              viewBox="0 0 24 24">
            <path fill-rule="evenodd" d="M12 20a7.966 7.966 0 0 1-5.002-1.756l.002.001v-.683c0-1.794 1.492-3.25 3.333-3.25h3.334c1.84 0 3.333 1.456 3.333 3.25v.683A7.966 7.966 0 0 1 12 20ZM2 12C2 6.477 6.477 2 12 2s10 4.477 10 10c0 5.5-4.44 9.963-9.932 10h-.138C6.438 21.962 2 17.5 2 12Zm10-5c-1.84 0-3.333 1.455-3.333 3.25S10.159 13.5 12 13.5c1.84 0 3.333-1.455 3.333-3.25S13.841 7 12 7Z" clip-rule="evenodd" />
         </svg>
         <div class="self-center font-bold capitalize">
            <span class="mr-1.5">{{ request.user.username }}</span>
         </div>
         <svg class="size-5 dark:text-white"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7" />
         </svg>
      </button>
   </div>
{% else %}
   <a type="button"
      href="{% url "account_login" %}"
      class="text-secondary-100 bg-primary-700 hover:bg-primary-800 focus:ring-2 focus:outline-none focus:ring-gray-100 font-extrabold tracking-wide rounded-lg text-sm px-5 py-2.5 text-center inline-flex items-center dark:focus:ring-gray-600 dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:hover:bg-gray-700 me-2">
      Sign In
   </a>
   <a type="button"
      href="{% url "account_signup" %}"
      class="text-secondary-100 bg-primary-700 hover:bg-primary-800 focus:ring-2 focus:outline-none focus:ring-gray-100 font-extrabold tracking-wide rounded-lg text-sm px-5 py-2.5 text-center inline-flex items-center dark:focus:ring-gray-600 dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:hover:bg-gray-700">
      Sign Up
   </a>
{% endif %}
